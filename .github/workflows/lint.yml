name: Lint

# В форке KarVPN автоматические прогоны Actions не запускаются: GitHub отключает
# workflow-файлы, которые были в репозитории на момент форка (см. docs/ci.md).
# Поэтому у линта есть ручной запуск — им и пользуемся, пока владелец не включит
# Actions в настройках форка.
on:
  push:
  pull_request:
  workflow_dispatch:
  # Этот же файл вызывает release.yml (jobs.lint.uses), поэтому нужен workflow_call:
  # без него вызов переиспользуемого workflow невалиден.
  workflow_call:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - run: uv sync --group dev

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Check linting
        run: uv run ruff check .
