name: Lint

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  # Перезапуск линта без нового коммита (в том числе по ветке).
  # 03.10.2026 CI в форке молчал, потому что GitHub отключает workflow-файлы
  # у форков — разбор и проверки в docs/ci.md.
  workflow_dispatch:
  # KarVPN Release использует тот же lint перед публикацией.
  workflow_call:

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - run: uv sync --frozen --group dev

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Check linting
        run: uv run ruff check .

      # Справка по структуре собирается из кода. Проверяем здесь, а не только
      # тестом: так расхождение видно до прогона всего набора.
      - name: Check structure reference is current
        run: uv run python -m scripts.generate_structure_reference --check
