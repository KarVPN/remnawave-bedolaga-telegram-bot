name: Lint

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  # Перезапуск линта без нового коммита (в том числе по ветке).
  # 03.10.2026 CI в форке молчал, потому что GitHub отключает workflow-файлы
  # у форков — разбор и проверки в docs/ci.md.
  workflow_dispatch:
  # Этот же файл вызывает release.yml (jobs.lint.uses), поэтому нужен workflow_call:
  # без него вызов переиспользуемого workflow невалиден.
  workflow_call:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - run: uv sync --group dev

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Check linting
        run: uv run ruff check .
