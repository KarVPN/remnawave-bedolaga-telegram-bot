name: Build and Publish Docker Image

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
  workflow_call:
    inputs:
      release_tag:
        description: Validated KarVPN release tag; empty for ordinary image builds.
        type: string
        default: ''
    outputs:
      image:
        description: Immutable reference of the tested and published image.
        value: ${{ jobs.build-and-push.outputs.image }}

permissions:
  contents: read

concurrency:
  group: bedolaga-image-${{ github.ref }}-${{ github.event_name }}-${{ inputs.release_tag || 'branch' }}
  cancel-in-progress: true

env:
  # Public deployment profile, matching the former Ansible source patches.
  TELEGRAM_AUTH_MAX_AGE_DAYS: ${{ vars.TELEGRAM_AUTH_MAX_AGE_DAYS || '3650' }}

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      image: ${{ steps.published.outputs.image }}
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Resolve upstream and KarVPN image version
        id: version
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: python3 scripts/karvpn_release.py metadata --tag "$RELEASE_TAG"

      - name: Verify KarVPN profile against current upstream source
        run: |
          python3 -m unittest discover -s tests -p test_karvpn_image_profile.py -v
          python3 -m unittest discover -s tests -p test_karvpn_release.py -v

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.version.outputs.image }}
          tags: |
            type=ref,event=pr
            type=raw,value=${{ inputs.release_tag || 'release-not-requested' }},enable=${{ inputs.release_tag != '' }}
            type=sha,format=long
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            io.karvpn.bedolaga.deploy-contract=1
            io.karvpn.bedolaga.telegram-auth-max-age-days=${{ env.TELEGRAM_AUTH_MAX_AGE_DAYS }}

      - name: Build on the GitHub runner
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            BUILD_DATE=${{ steps.version.outputs.build_date }}
            VCS_REF=${{ github.sha }}
            TELEGRAM_AUTH_MAX_AGE_DAYS=${{ env.TELEGRAM_AUTH_MAX_AGE_DAYS }}
          cache-from: type=gha,scope=bot-amd64
          cache-to: type=gha,scope=bot-amd64,mode=max

      - name: Smoke test without Telegram polling or production connections
        env:
          IMAGE_ID: ${{ steps.build.outputs.imageid }}
        run: |
          docker run --rm --network none --entrypoint python \
            -e BOT_TOKEN=123456789:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA \
            -e ADMIN_IDS=1 -e WEB_API_ENABLED=true -e CABINET_ENABLED=true \
            "$IMAGE_ID" scripts/smoke_karvpn_image.py

      # Registry credentials are only introduced after the image is built/tested.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the tested image
        if: github.event_name != 'pull_request'
        id: published
        env:
          IMAGE_NAME: ${{ steps.version.outputs.image }}
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          IMAGE_VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          while IFS= read -r tag; do
            docker push "$tag"
          done <<< "$IMAGE_TAGS"
          image=$(docker image inspect "$IMAGE_NAME:sha-$GITHUB_SHA" --format '{{index .RepoDigests 0}}')
          echo "image=$image" >> "$GITHUB_OUTPUT"
          {
            echo '## Bedolaga image ready'
            echo
            echo "Version: $IMAGE_VERSION. Platform: linux/amd64. Commit: $GITHUB_SHA."
            echo
            echo 'Immutable reference for a test or rollback:'
            echo '```yaml'
            echo "remnawave_bedolaga_telegram_bot_image: $image"
            echo '```'
            echo
            echo 'Normal deployments can keep the main tag; Ansible resolves and pins the downloaded digest.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Scan published image with Trivy
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ${{ steps.published.outputs.image }}
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          exit-code: '0'

      - name: Upload Trivy results to Security tab
        if: github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy
