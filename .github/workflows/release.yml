name: KarVPN Release

on:
  push:
    tags: ['v*-karvpn.*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the configured release from main (false previews notes only).
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: karvpn-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      publish: ${{ steps.release.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate the explicit KarVPN version and preview notes
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
        shell: bash
        run: |
          python3 scripts/karvpn_release.py metadata
          args=(notes --output "$RUNNER_TEMP/karvpn-release-notes.md")
          if [[ "$PUBLISH" == true ]]; then
            args+=(--publish)
          fi
          python3 scripts/karvpn_release.py "${args[@]}"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          {
            echo '## KarVPN release preview'
            echo
            cat "$RUNNER_TEMP/karvpn-release-notes.md"
          } >> "$GITHUB_STEP_SUMMARY"

  lint:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    uses: ./.github/workflows/lint.yml

  image:
    needs: [prepare, lint]
    if: needs.prepare.outputs.publish == 'true'
    permissions:
      contents: read
      packages: write
      security-events: write
    uses: ./.github/workflows/docker-registry.yml
    with:
      release_tag: ${{ needs.prepare.outputs.tag }}

  release:
    needs: [prepare, image]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Publish the release after the image has passed its checks
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_IMAGE: ${{ needs.image.outputs.image }}
        shell: bash
        run: |
          python3 scripts/karvpn_release.py notes --publish --tag "$RELEASE_TAG" \
            --image "$RELEASE_IMAGE" --output "$RUNNER_TEMP/karvpn-release-notes.md"
          gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/karvpn-release-notes.md" \
            --latest
