name: KarVPN Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: karvpn-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      publish: ${{ steps.release.outputs.publish }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      commit: ${{ steps.release.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Find a reviewed and merged release PR awaiting publication
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/karvpn_release_pr.py pending

  lint:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    uses: ./.github/workflows/lint.yml
    with:
      source_ref: ${{ needs.prepare.outputs.commit }}

  image:
    needs: [prepare, lint]
    if: needs.prepare.outputs.publish == 'true'
    permissions:
      contents: read
      packages: write
      security-events: write
    uses: ./.github/workflows/docker-registry.yml
    with:
      release_tag: ${{ needs.prepare.outputs.tag }}
      source_ref: ${{ needs.prepare.outputs.commit }}

  release:
    needs: [prepare, image]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Publish the reviewed release after the image has passed its checks
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          KARVPN_RELEASE_SHA: ${{ needs.prepare.outputs.commit }}
          RELEASE_IMAGE: ${{ needs.image.outputs.image }}
        run: |
          python3 scripts/karvpn_release.py notes --publish --tag "$RELEASE_TAG" \
            --image "$RELEASE_IMAGE" --output "$RUNNER_TEMP/karvpn-release-notes.md"
          gh release create "$RELEASE_TAG" --target "$KARVPN_RELEASE_SHA" \
            --title "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/karvpn-release-notes.md" --latest

  release-pr:
    needs: [prepare, release]
    if: always() && needs.prepare.result == 'success' && (needs.prepare.outputs.publish == 'false' || needs.release.result == 'success')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Create or update the next KarVPN release PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/karvpn_release_pr.py propose
